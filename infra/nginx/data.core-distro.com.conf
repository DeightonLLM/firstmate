# Hostinger KVM8 (srv1137994-elevatesci / 45.90.220.156)
# Reverse proxy configuration for data.core-distro.com
# Version: 2026-10-19-v2 (SAMEORIGIN frame header enabled for dashboard iframe)
# Upstream: Namecheap production backend (https://66.29.153.174)

server {
    listen 80;
    server_name data.core-distro.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name data.core-distro.com;

    ssl_certificate /etc/letsencrypt/live/core-distro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/core-distro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass https://66.29.153.174;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_ssl_server_name on;
        proxy_ssl_name       data.core-distro.com;
        proxy_ssl_verify     off;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols  TLSv1.2 TLSv1.3;

        proxy_cookie_flags  PHPSESSID secure httponly;
    }
}
